<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans+Devanagari:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@100;200;300;400;500;600;700&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/913fc2502a.js" crossorigin="anonymous"></script>

    <link rel="shortcut icon" href="Assest/pokemon_logo.webp" type="image/x-icon">
  </head>
  <body>
    <div class="main">
      <div class="leftSection">
        <div class="pokemonLogo">
          <img src="Assest/pokemon_logo.webp" alt="" />
        </div>
        <div class="PokemonContaier">
          <div class="heading">
            <span>Pokemon Gen 1</span>
          </div>
          <div class="MainHeading">
            <h1>Pikachu</h1>
          </div>
          <div class="PokemonDeltails">
            <p>
              Pikachu is an Electric-type Pokémon introduced in Generation I.
              Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
              They are almost completely covered by yellow fur.
            </p>
          </div>
          <div class="PokemonDateTime">
            <div class="line"></div>
            <div class="date" > <h6> 01 / 08</h6></div>
           
          </div>
          <div class="BallImg">
            <img src="Assest/512x512bb-removebg-preview.webp" alt="" />
          </div>
        </div>
      </div>
      <div class="PikachuImg">
        <img src="Assest/pikachu_img.webp" alt="" />
      </div>
      <div class="RightSection">
        <div class="RightThings">
          <div class="Hamburger">
            <i class="fa-solid fa-bars"></i>
          </div>
          <div>
            <ul>
              <li></li>
              <li></li>
              <li></li>
              <li></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
